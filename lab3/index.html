<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Pot</title>

    <style>
        body {
            background-color: #f5e6d3;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: #8b4513;
        }

        .pot {
            width: 220px;
            height: 250px;
            background-color: #b5651d;
            border-radius: 20px 20px 45% 45%;
            margin: 50px auto 20px;
            position: relative;
            box-shadow: 5px 8px 15px #888;
        }

        .pot::before {
            content: "";
            position: absolute;
            width: 100px;
            height: 35px;
            background-color: #8b4513;
            border-radius: 50%;
            top: -15px;
            left: 60px;
        }

        .design {
            position: absolute;
            width: 180px;
            height: 40px;
            border-top: 5px solid #f4c27a;
            border-bottom: 5px solid #f4c27a;
            top: 100px;
            left: 20px;
        }

        p {
            color: #5c3317;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🇮🇳 Traditional Indian Pot</h1>

    <div class="pot">
        <div class="design"></div>
    </div>

    <p>Traditional Indian Matka (मटका)</p>
    <p>Used to naturally cool drinking water.</p>

</body>
</html>
